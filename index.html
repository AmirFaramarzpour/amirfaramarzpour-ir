<style>
  :root {
    --neon: #00ff8c;
    --neon-dim: #00ff8c55;
    --bg: #030604;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, 'Courier New', monospace;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  canvas#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,255,140,0.025) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode: overlay;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
  }

  .content {
    position: relative;
    z-index: 4;
    text-align: center;
    padding: 32px 24px;
    max-width: 780px;
    width: 100%;
  }

  h1 {
    margin: 0 0 18px;
    font-size: clamp(20px, 4vw, 32px);
    letter-spacing: 0.15em;
    font-weight: 700;
    color: var(--neon);
    text-shadow: 0 0 6px var(--neon), 0 0 24px var(--neon-dim);
    text-transform: uppercase;
  }

  .map-wrap {
    position: relative;
    width: min(88vw, 520px);
    margin: 0 auto 22px;
    filter: drop-shadow(0 0 10px var(--neon-dim));
  }

  .map-wrap svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  .iran-path {
    fill: rgba(0, 255, 140, 0.06);
    stroke: var(--neon);
    stroke-width: 1.4;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    stroke-dasharray: 6000;
    stroke-dashoffset: 6000;
    animation: draw-border 3.2s ease-out forwards, pulse-fill 4s ease-in-out 3.2s infinite;
  }

  @keyframes draw-border {
    to { stroke-dashoffset: 0; }
  }

  @keyframes pulse-fill {
    0%, 100% { fill: rgba(0, 255, 140, 0.05); }
    50% { fill: rgba(0, 255, 140, 0.13); }
  }

  .glow-dot {
    animation: blip 2.4s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes blip {
    0%, 100% { opacity: 0.35; r: 3; }
    50% { opacity: 1; r: 5.5; }
  }

  .quote {
    font-size: clamp(13px, 2vw, 16px);
    line-height: 1.7;
    color: #c9ffe6;
    text-shadow: 0 0 4px var(--neon-dim);
    max-width: 640px;
    margin: 0 auto 22px;
    font-style: italic;
    opacity: 0;
    animation: fade-in 1.2s ease-out 3.4s forwards;
  }

  @keyframes fade-in {
    to { opacity: 1; }
  }

  .signature {
    display: inline-block;
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 700;
    color: var(--neon);
    text-shadow: 0 0 6px var(--neon), 0 0 18px var(--neon-dim);
    overflow: hidden;
    white-space: nowrap;
    border-right: 0.15em solid var(--neon);
    width: 0;
    animation:
      typing 2.4s steps(18, end) 3.6s forwards,
      blink-caret 0.75s step-end infinite;
  }

  @keyframes typing {
    to { width: 15.5ch; }
  }

  @keyframes blink-caret {
    from, to { border-color: transparent; }
    50% { border-color: var(--neon); }
  }

  @media (max-width: 480px) {
    .content { padding: 20px 16px; }
  }
</style>

  <p class="quote">&ldquo;Systems fall silent, but memory does not. What is built in the dark still casts a shadow in the light.&rdquo;</p>

  <div class="signature">System Pwned</div>
</div>

<script>
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let w, h, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', () => { resize(); initParticles(); });

  let particles = [];
  const COUNT = 90;

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * w;
      this.y = Math.random() * h;
      this.baseSize = Math.random() * 1.8 + 0.6;
      this.size = this.baseSize;
      this.speedX = (Math.random() - 0.5) * 0.35;
      this.speedY = (Math.random() - 0.5) * 0.35;
      this.alpha = Math.random() * 0.5 + 0.3;
      this.twinkleSpeed = Math.random() * 0.02 + 0.005;
      this.twinklePhase = Math.random() * Math.PI * 2;
    }
    update(t) {
      this.x += this.speedX;
      this.y += this.speedY;
      if (this.x < -10) this.x = w + 10;
      if (this.x > w + 10) this.x = -10;
      if (this.y < -10) this.y = h + 10;
      if (this.y > h + 10) this.y = -10;
      this.size = this.baseSize * (0.7 + 0.3 * Math.sin(t * this.twinkleSpeed + this.twinklePhase));
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, Math.max(this.size, 0.2), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 255, 140, ${this.alpha})`;
      ctx.fill();
    }
  }

  function initParticles() {
    particles = Array.from({ length: COUNT }, () => new Particle());
  }
  initParticles();

  const LINK_DIST = 110;

  function animate(t) {
    ctx.clearRect(0, 0, w, h);
    for (const p of particles) {
      p.update(t);
      p.draw();
    }
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINK_DIST) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(0, 255, 140, ${0.12 * (1 - dist / LINK_DIST)})`;
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
</script>
